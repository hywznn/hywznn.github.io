theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Seoul
title: "현준의 개발 노트"
tagline: "AI 서비스와 개발 기록"
description: "AI 서비스 개발과 데이터 실험을 기록합니다."
url: "https://hywznn.github.io"
baseurl: ""

avatar: /assets/img/avatar.png
theme_mode: light
github:
  username: hywznn
social:
  name: 최현준
  links:
    - https://github.com/hywznn

toc: true
actions:
  edit_post:
    enabled: true
    url: "https://github.com/hywznn/hywznn.github.io/edit/master"
    static_url: false
assets:
  self_host:
    enabled: true
pwa:
  enabled: false
paginate: 10
paginate_path: /blog/page:num/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  ignore:
    envs: [development]

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
